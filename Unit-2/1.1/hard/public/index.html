<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node.js Static File Server</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <img src="/car.svg" alt="A sample SVG graphic" />
      <h1>Node.js Static File Server</h1>
      <p>This HTML page, CSS stylesheet, and SVG image are served with correct MIME types from the <code>/public</code> directory.</p>
      <div class="info">
        <h3>Supported MIME Types:</h3>
        <ul>
          <li><strong>HTML:</strong> <code>text/html</code></li>
          <li><strong>CSS:</strong> <code>text/css</code></li>
          <li><strong>SVG:</strong> <code>image/svg+xml</code></li>
          <li><strong>PNG / JPG:</strong> <code>image/png / image/jpeg</code></li>
        </ul>
      </div>
    </main>
  </body>
</html>
